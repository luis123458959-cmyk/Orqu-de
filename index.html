<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eu te amo, Thays 💜</title>
  <style>
    html, body {
      background-size: cover;
      background-position: center;
      animation: fundoOrquideas 30s infinite alternate;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      color: #6a1b9a;
      text-shadow: 2px 2px 6px rgba(255,255,255,0.9);
      padding: 20px 30px;
      background: rgba(255,255,255,0.8);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }

    /* Emojis flutuando */
    .orchid {
      position: absolute;
      bottom: -50px;
      font-size: 32px;
      animation: floatUp linear infinite;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes fundoOrquideas {
      0% {
        background-image: url('https://images.pexels.com/photos/460621/pexels-photo-460621.jpeg');
      }
      33% {
        background-image: url('https://images.pexels.com/photos/931177/pexels-photo-931177.jpeg');
      }
      66% {
        background-image: url('https://images.pexels.com/photos/1022923/pexels-photo-1022923.jpeg');
      }
      100% {
        background-image: url('https://images.pexels.com/photos/1366630/pexels-photo-1366630.jpeg');
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
      }
      to {
        transform: translateY(-120vh) rotate(360deg);
      }
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Música em loop -->
  <audio autoplay loop>
    <source src="ZéVitor ft. Kamaitachi - Bruxa (Lyric Video oficial) - ZéVitor (youtube).mp3" type="audio/mpeg">
  </audio>

  <!-- Emojis de orquídea -->
  <div class="orchid" style="left: 5%; animation-duration: 14s;">🪻</div>
  <div class="orchid" style="left: 15%; animation-duration: 18s; font-size: 40px;">🪻</div>
  <div class="orchid" style="left: 30%; animation-duration: 16s;">🪻</div>
  <div class="orchid" style="left: 45%; animation-duration: 20s; font-size: 36px;">🪻</div>
  <div class="orchid" style="left: 60%; animation-duration: 15s;">🪻</div>
  <div class="orchid" style="left: 75%; animation-duration: 22s; font-size: 42px;">🪻</div>
  <div class="orchid" style="left: 90%; animation-duration: 17s;">🪻</div>

  <div class="overlay">
    <h1>
      eu te amo<br>
      thays santos da silva 💜
      <div style="margin-top:16px;font-size:1.4rem;font-weight:normal;color:#7b4a9e;">
        como orquídeas, nosso amor florescerá novamente
      </div>
    </h1>
  </div>

</body>
</html>
